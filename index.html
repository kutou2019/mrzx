<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日资讯</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1d1d1f;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #0071e3; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 顶部导航 */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px;
  }
  .nav-logo {
    font-size: 18px; font-weight: 700; color: #1d1d1f;
    letter-spacing: -0.02em;
  }
  .nav-logo span { color: #0071e3; }
  .nav-date {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: #86868b;
  }
  .nav-date button {
    background: none; border: none; cursor: pointer;
    color: #0071e3; font-size: 18px; padding: 4px 10px;
    border-radius: 6px; transition: background 0.2s;
    font-family: inherit; line-height: 1;
  }
  .nav-date button:hover { background: rgba(0,113,227,0.08); }
  .nav-date input[type="date"] {
    border: 1px solid #d2d2d7; border-radius: 8px;
    padding: 5px 10px; font-size: 13px; color: #1d1d1f;
    background: #fff; font-family: inherit; cursor: pointer;
    min-width: 140px;
  }

  /* Hero区 */
  .hero {
    padding: 110px 24px 50px;
    text-align: center;
    max-width: 1200px; margin: 0 auto;
  }
  .hero-date {
    font-size: 56px; font-weight: 700; letter-spacing: -0.03em;
    color: #1d1d1f; line-height: 1.1;
  }
  .hero-date .month { color: #0071e3; }
  .hero-sub {
    margin-top: 14px; font-size: 17px; color: #86868b;
    font-weight: 400;
  }
  .hero-stats {
    margin-top: 28px; display: flex; justify-content: center; gap: 56px;
    flex-wrap: wrap;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-size: 32px; font-weight: 700; color: #1d1d1f;
    letter-spacing: -0.02em;
  }
  .stat-label { font-size: 13px; color: #86868b; margin-top: 4px; }

  /* 板块筛选 */
  .filter-bar {
    position: sticky; top: 52px; z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 10px 0;
  }
  .filter-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 8px; overflow-x: auto;
    padding: 0 24px;
    scrollbar-width: thin;
    scrollbar-color: #d2d2d7 transparent;
  }
  .filter-inner::-webkit-scrollbar { height: 4px; }
  .filter-inner::-webkit-scrollbar-track { background: transparent; }
  .filter-inner::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }
  .filter-tag {
    flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    background: #f5f5f7; color: #1d1d1f; border: 1px solid transparent;
    transition: all 0.2s; font-family: inherit; white-space: nowrap;
  }
  .filter-tag:hover { background: #e8e8ed; }
  .filter-tag.active {
    background: #0071e3; color: #fff;
  }

  /* 主体内容 */
  .main {
    max-width: 1200px; margin: 0 auto;
    padding: 36px 24px 80px;
  }

  /* 板块视图 - 分组 */
  .section {
    margin-bottom: 48px;
    scroll-margin-top: 120px;
  }
  .section-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f2;
  }
  .section-title {
    font-size: 22px; font-weight: 700; color: #1d1d1f;
    letter-spacing: -0.02em;
  }
  .section-count {
    font-size: 13px; color: #86868b; font-weight: 400;
  }

  /* 资讯卡片网格 */
  .news-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }

  /* 全部视图 - 单列按热度排序 */
  .news-list {
    display: flex; flex-direction: column; gap: 12px;
    max-width: 800px; margin: 0 auto;
  }

  .news-card {
    background: #fff; border: 1px solid #e8e8ed;
    border-radius: 14px; padding: 18px 20px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .news-card:hover {
    border-color: #0071e3;
    box-shadow: 0 4px 20px rgba(0,113,227,0.08);
    transform: translateY(-1px);
  }

  /* 卡片顶部：排名+板块+热度 */
  .card-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-left {
    display: flex; align-items: center; gap: 10px;
  }
  .rank-badge {
    font-size: 13px; font-weight: 700; color: #86868b;
    min-width: 24px;
  }
  .rank-badge.top1 { color: #ff3b30; }
  .rank-badge.top2 { color: #ff9500; }
  .rank-badge.top3 { color: #ffcc00; }
  .section-tag {
    font-size: 11px; font-weight: 500; color: #0071e3;
    background: #f0f7ff; padding: 3px 8px; border-radius: 4px;
  }
  .heat-badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; color: #ff6b35;
  }
  .heat-badge svg { width: 14px; height: 14px; }

  .news-title {
    font-size: 16px; font-weight: 600; color: #1d1d1f;
    line-height: 1.4; margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .news-content {
    font-size: 14px; color: #424245; line-height: 1.6;
    margin-bottom: 8px;
  }
  .news-data {
    font-size: 13px; color: #0071e3; font-weight: 500;
    margin-bottom: 10px; padding: 5px 10px;
    background: #f5f9ff; border-radius: 6px;
    display: inline-block;
  }
  .news-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px; border-top: 1px solid #f5f5f7;
    font-size: 12px;
  }
  .news-source a {
    color: #86868b; font-weight: 400;
    display: flex; align-items: center; gap: 4px;
  }
  .news-source a:hover { color: #0071e3; text-decoration: none; }
  .news-source svg { width: 12px; height: 12px; }
  .news-impact {
    color: #86868b; font-style: italic;
    max-width: 55%; text-align: right;
  }

  /* 底部 */
  .footer {
    border-top: 1px solid #f0f0f2;
    padding: 28px 24px; text-align: center;
    color: #86868b; font-size: 13px;
  }
  .footer p { margin-bottom: 4px; }

  /* 空状态 */
  .empty-state {
    text-align: center; padding: 80px 24px;
    color: #86868b;
  }
  .empty-state h3 {
    font-size: 20px; color: #1d1d1f; margin-bottom: 8px;
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .hero-date { font-size: 36px; }
    .hero-sub { font-size: 15px; }
    .hero-stats { gap: 32px; }
    .stat-num { font-size: 26px; }
    .news-grid { grid-template-columns: 1fr; }
    .section-title { font-size: 20px; }
    .nav-date { gap: 4px; }
    .nav-date input[type="date"] { font-size: 12px; padding: 4px 6px; min-width: 120px; }
    .news-impact { display: none; }
  }
  @media (max-width: 480px) {
    .hero { padding: 90px 16px 36px; }
    .hero-date { font-size: 28px; }
    .main { padding: 24px 16px 60px; }
    .news-card { padding: 14px 16px; }
    .nav-inner { padding: 0 16px; }
    .filter-inner { padding: 0 16px; }
  }
</style>
</head>

// ===== 板块配置 =====
const sections = [
  "AI人工智能", "半导体", "消费电子", "电商零售", "新能源汽车",
  "餐饮茶饮", "宏观经济", "A股市场", "游戏电竞", "娱乐八卦",
  "奇葩事件", "车祸事故", "医疗健康"
];

// ===== 状态 =====
let currentDate = "2026-09-07";
let currentFilter = "all";

// ===== 工具函数 =====
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return { month: d.getMonth() + 1, day: d.getDate(), year: d.getFullYear() };
}

function getWeekday(dateStr) {
  const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  return days[new Date(dateStr).getDay()];
}

function changeDate(days) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + days);
  const newDate = d.toISOString().split("T")[0];
  setDate(newDate);
}

function setDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("datePicker").value = dateStr;
  renderHero();
  renderContent();
}

// 获取所有资讯并按热度排序（全部视图用）
function getAllNewsSorted() {
  const data = newsData[currentDate];
  if (!data) return [];
  const allNews = [];
  for (const sec in data) {
    data[sec].forEach(item => {
      allNews.push({ ...item, section: sec });
    });
  }
  allNews.sort((a, b) => b.heat - a.heat);
  return allNews;
}

// ===== 渲染 Hero =====
function renderHero() {
  const { month, day } = formatDate(currentDate);
  const weekday = getWeekday(currentDate);
  document.getElementById("heroDate").innerHTML = `<span class="month">${month}月</span>${day}日`;
  document.getElementById("heroWeekday").textContent = `${weekday} · 每日精选资讯`;

  const data = newsData[currentDate];
  if (data) {
    let total = 0;
    let secCount = 0;
    for (const key in data) {
      total += data[key].length;
      secCount++;
    }
    document.getElementById("totalCount").textContent = total;
    document.getElementById("sectionCount").textContent = secCount;
  } else {
    document.getElementById("totalCount").textContent = "0";
    document.getElementById("sectionCount").textContent = "0";
  }
}

// ===== 渲染筛选栏 =====
function renderFilterBar() {
  const bar = document.getElementById("filterBar");
  bar.innerHTML = '<button class="filter-tag active" data-section="all">全部</button>';
  sections.forEach(sec => {
    const btn = document.createElement("button");
    btn.className = "filter-tag";
    btn.dataset.section = sec;
    btn.textContent = sec;
    bar.appendChild(btn);
  });

  bar.querySelectorAll(".filter-tag").forEach(btn => {
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".filter-tag").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.section;
      renderContent();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

// ===== 热度图标SVG =====
const heatIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c0 0-6 6-6 11a6 6 0 0 0 12 0c0-5-6-11-6-11zm0 18a4 4 0 0 1-4-4c0-2.5 2-5 4-7 2 2 4 4.5 4 7a4 4 0 0 1-4 4z"/></svg>';

const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

// ===== 渲染内容 =====
function renderContent() {
  const main = document.getElementById("mainContent");
  const data = newsData[currentDate];

  if (!data) {
    main.innerHTML = `
      <div class="empty-state">
        <h3>暂无数据</h3>
        <p>该日期的资讯尚未更新，请选择其他日期查看</p>
      </div>
    `;
    return;
  }

  // 全部视图：按热度排序的单列列表
  if (currentFilter === "all") {
    const allNews = getAllNewsSorted();
    let html = '<div class="news-list">';
    allNews.forEach((item, index) => {
      const rankClass = index === 0 ? 'top1' : index === 1 ? 'top2' : index === 2 ? 'top3' : '';
      html += `
        <article class="news-card">
          <div class="card-top">
            <div class="card-left">
              <span class="rank-badge ${rankClass}">${index + 1}</span>
              <span class="section-tag">${item.section}</span>
            </div>
            <span class="heat-badge">${heatIcon} ${item.heat}</span>
          </div>
          <h3 class="news-title">${item.title}</h3>
          <p class="news-content">${item.content}</p>
          ${item.data ? `<div class="news-data">${item.data}</div>` : ""}
          <div class="news-meta">
            <span class="news-source">
              <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer">
                ${linkIcon} 来源：${item.source}
              </a>
            </span>
            ${item.impact ? `<span class="news-impact">${item.impact}</span>` : ""}
          </div>
        </article>
      `;
    });
    html += '</div>';
    main.innerHTML = html;
    return;
  }

  // 板块视图：按板块分组，板块内按热度排序
  const sec = currentFilter;
  const news = (data[sec] || []).slice().sort((a, b) => b.heat - a.heat);

  let html = `
    <section class="section" id="section-${sec}">
      <div class="section-header">
        <h2 class="section-title">${sec}</h2>
        <span class="section-count">${news.length} 条资讯 · 按热度排序</span>
      </div>
      <div class="news-grid">
  `;

  news.forEach((item, index) => {
    const rankClass = index === 0 ? 'top1' : index === 1 ? 'top2' : index === 2 ? 'top3' : '';
    html += `
      <article class="news-card">
        <div class="card-top">
          <div class="card-left">
            <span class="rank-badge ${rankClass}">${index + 1}</span>
          </div>
          <span class="heat-badge">${heatIcon} ${item.heat}</span>
        </div>
        <h3 class="news-title">${item.title}</h3>
        <p class="news-content">${item.content}</p>
        ${item.data ? `<div class="news-data">${item.data}</div>` : ""}
        <div class="news-meta">
          <span class="news-source">
            <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer">
              ${linkIcon} 来源：${item.source}
            </a>
          </span>
          ${item.impact ? `<span class="news-impact">${item.impact}</span>` : ""}
        </div>
      </article>
    `;
  });

  html += `</div></section>`;
  main.innerHTML = html;
}

// ===== 事件绑定 =====
document.getElementById("prevDay").addEventListener("click", () => changeDate(-1));
document.getElementById("nextDay").addEventListener("click", () => changeDate(1));
document.getElementById("datePicker").addEventListener("change", (e) => {
  if (e.target.value) setDate(e.target.value);
});

// ===== 初始化 =====
renderFilterBar();
setDate("2026-09-07");
</script>
</body>
</html>
